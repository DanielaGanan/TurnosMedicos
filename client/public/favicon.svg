<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5C9D7"/>
      <stop offset="100%" stop-color="#C48CB3"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#83A6CE"/>
      <stop offset="100%" stop-color="#C48CB3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b1b32" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- background circle -->
  <circle cx="32" cy="32" r="28" fill="url(#g2)"/>
  <!-- medical cross -->
  <g filter="url(#shadow)">
    <rect x="26" y="16" width="12" height="32" rx="2" fill="url(#g1)"/>
    <rect x="16" y="26" width="32" height="12" rx="2" fill="url(#g1)"/>
  </g>
  <!-- subtle ring -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#ffffff" opacity="0.18"/>
  <title>Turnos Médicos</title>
  <desc>Favicon con cruz médica usando la paleta rosa/celeste</desc>
</svg>

